name: mpls-corp
topology:
  nodes:
    pe1: # Provider Edge 1 (Router que conecta al cliente)
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./configs/pe1/daemons:/etc/frr/daemons
        - ./configs/pe1/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
        net.mpls.platform_labels: "1048575"
      exec:
        - sysctl -w net.mpls.conf.eth2.input=1
    p:   # Provider Core (Router del núcleo del ISP)
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./configs/p/daemons:/etc/frr/daemons
        - ./configs/p/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
        net.mpls.platform_labels: "1048575"
      exec:
        - sysctl -w net.mpls.conf.eth1.input=1
        - sysctl -w net.mpls.conf.eth2.input=1
    pe2: # Provider Edge 2
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./configs/pe2/daemons:/etc/frr/daemons
        - ./configs/pe2/frr.conf:/etc/frr/frr.conf
      sysctls:
        net.ipv4.ip_forward: "1"
        net.mpls.platform_labels: "1048575"
      exec:
        - sysctl -w net.mpls.conf.eth1.input=1
    ce1: # Customer Edge 1 (Sucursal A del Cliente)
      kind: linux
      image: alpine:latest
    ce2: # Customer Edge 2 (Sucursal B del Cliente)
      kind: linux
      image: alpine:latest

  links:
    - endpoints: ["ce1:eth1", "pe1:eth1"]
    - endpoints: ["pe1:eth2", "p:eth1"]
    - endpoints: ["p:eth2", "pe2:eth1"]
    - endpoints: ["pe2:eth2", "ce2:eth1"]
