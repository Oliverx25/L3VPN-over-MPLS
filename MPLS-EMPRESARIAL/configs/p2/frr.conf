hostname p2
!
interface lo
 ip address 10.255.255.4/32
 ip ospf cost 1
 ip ospf area 0
!
interface eth1
 ip address 10.0.24.1/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf area 0
!
interface eth2
 ip address 10.0.43.0/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf area 0
!
interface eth3
 ip address 10.0.14.1/31
 ip ospf network point-to-point
 ip ospf cost 60
 ip ospf area 0
!
router ospf
 ospf router-id 10.255.255.4
exit
!
mpls ldp
 router-id 10.255.255.4
 address-family ipv4
  discovery transport-address 10.255.255.4
  ttl-security disable
  interface eth1
  exit
  interface eth2
  exit
  interface eth3
  exit
 exit-address-family
exit
