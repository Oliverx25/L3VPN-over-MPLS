hostname pe2
!
interface lo
 ip address 10.255.255.3/32
 ip ospf area 0
!
interface eth1
 ip address 10.0.23.1/31
 ip ospf network point-to-point
 ip ospf area 0
!
router ospf
 ospf router-id 10.255.255.3
!
mpls ldp
 router-id 10.255.255.3
 address-family ipv4
  discovery transport-address 10.255.255.3
  interface eth1
  exit
 exit-address-family
exit
