hostname p
!
interface lo
 ip address 10.255.255.2/32
 ip ospf area 0
!
interface eth1
 ip address 10.0.12.1/31
 ip ospf network point-to-point
 ip ospf area 0
!
interface eth2
 ip address 10.0.23.0/31
 ip ospf network point-to-point
 ip ospf area 0
!
router ospf
 ospf router-id 10.255.255.2
!
mpls ldp
 router-id 10.255.255.2
 address-family ipv4
  discovery transport-address 10.255.255.2
  interface eth1
  exit
  interface eth2
  exit
 exit-address-family
exit
